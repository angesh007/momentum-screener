services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
